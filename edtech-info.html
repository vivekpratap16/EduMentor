        async function populateCoursesAndSpecializations(uni) {
            const courseSelect = document.getElementById('api_course');
            const specSelect = document.getElementById('api_specialization');
            const specBox = document.getElementById('api_spec_box');
            const coursesListEl = document.getElementById('liveCoursesContainer');
            const badge = document.getElementById('apiLookupBadge');

            let liveCourses = [];
            try {
                // Try backend proxy first (/api/courses?key=...), then direct endpoint
                let res = await fetch(`/api/courses?key=${encodeURIComponent(uni.key)}`).catch(() => null);
                if (!res || !res.ok) {
                    res = await fetch(`https://universityadmission.co.in/api/settings/courses?key=${encodeURIComponent(uni.key)}`);
                }
                if (res && res.ok) {
                    const raw = await res.json();
                    liveCourses = Array.isArray(raw) ? raw : (raw.data || raw.courses || []);
                }
            } catch (_) {}

            if (liveCourses.length > 0) {
                badge.textContent = "✓ Live API Courses Loaded";
                badge.className = "text-[10px] font-extrabold uppercase bg-emerald-50 text-emerald-700 border border-emerald-200 px-2.5 py-1 rounded-full";

                courseSelect.innerHTML = liveCourses.map(c => {
                    const cName = c.course_name || c.name || c.course;
                    const cKey = c.course_key || c.key || c.id || '';
                    return `<option value="${cName}" data-course-key="${cKey}">${cName}</option>`;
                }).join('');

                coursesListEl.innerHTML = liveCourses.map(c => {
                    const cName = c.course_name || c.name || c.course;
                    return `
                        <div class="p-4 rounded-2xl border border-slate-200 bg-slate-50 flex justify-between items-center">
                            <span class="font-extrabold text-slate-900 text-sm"><i class="fa-solid fa-graduation-cap text-indigo-600 mr-2"></i>${cName}</span>
                            <span class="text-xs font-bold text-indigo-700">UGC-DEB Validated</span>
                        </div>
                    `;
                }).join('');

                // Load sub-courses when course changes
                courseSelect.addEventListener('change', async () => {
                    const cKey = courseSelect.selectedOptions[0]?.dataset?.courseKey;
                    if (!cKey) return;
                    try {
                        let sRes = await fetch(`/api/sub-courses?course=${encodeURIComponent(cKey)}`).catch(() => null);
                        if (!sRes || !sRes.ok) {
                            sRes = await fetch(`https://universityadmission.co.in/api/settings/sub_courses?course=${encodeURIComponent(cKey)}`);
                        }
                        if (sRes && sRes.ok) {
                            const sRaw = await sRes.json();
                            const sList = Array.isArray(sRaw) ? sRaw : (sRaw.data || sRaw.sub_courses || []);
                            if (sList.length > 0) {
                                specBox.style.display = 'block';
                                specSelect.innerHTML = sList.map(s => {
                                    const sName = s.sub_course_name || s.specialization || s.name || s;
                                    return `<option value="${sName}">${sName}</option>`;
                                }).join('');
                            } else {
                                specBox.style.display = 'none';
                                specSelect.innerHTML = `<option value="">Not Applicable</option>`;
                            }
                        }
                    } catch (_) {}
                });
                courseSelect.dispatchEvent(new Event('change'));
            } else {
                // Verified Fallback Matrix
                badge.textContent = "✓ Verified Course Matrix Active";
                const courseNames = Object.keys(DEFAULT_COURSE_MAP);
                courseSelect.innerHTML = courseNames.map(c => `<option value="${c}">${c}</option>`).join('');

                coursesListEl.innerHTML = courseNames.map(c => `
                    <div class="p-4 rounded-2xl border border-slate-200 bg-slate-50">
                        <div class="flex justify-between items-center">
                            <strong class="text-sm text-slate-900"><i class="fa-solid fa-graduation-cap text-indigo-600 mr-2"></i>${c}</strong>
                            <span class="text-[11px] font-bold text-emerald-700 bg-emerald-50 border border-emerald-200 px-2.5 py-0.5 rounded-full">0% EMI Available</span>
                        </div>
                        <div class="flex flex-wrap gap-1.5 mt-2">
                            ${DEFAULT_COURSE_MAP[c].map(sp => `<span class="text-[11px] bg-white border border-slate-200 px-2.5 py-0.5 rounded-md font-semibold text-slate-600">${sp}</span>`).join('')}
                        </div>
                    </div>
                `).join('');

                courseSelect.addEventListener('change', () => {
                    const specs = DEFAULT_COURSE_MAP[courseSelect.value] || [];
                    if (specs.length > 0) {
                        specBox.style.display = 'block';
                        specSelect.innerHTML = specs.map(s => `<option value="${s}">${s}</option>`).join('');
                    } else {
                        specBox.style.display = 'none';
                        specSelect.innerHTML = `<option value="">General</option>`;
                    }
                });
                courseSelect.dispatchEvent(new Event('change'));
            }
        }

        function getDuplicateMessage(code) {
            const map = {
                0: "Fresh Lead (Code 0): Email aur mobile dono naye hain.",
                1: "Duplicate Check (Code 1): Email pehle se university portal par maujood hai.",
                2: "Duplicate Check (Code 2): Mobile pehle se university portal par maujood hai.",
                3: "Duplicate Check (Code 3): Email aur mobile dono pehle se maujood hain."
            };
            return map[code] || "Verified via CV Partner API.";
        }

        function bindLeadForm(uni) {
            document.getElementById('directApiLeadForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = document.getElementById('apiSubmitBtn');
                const respBox = document.getElementById('apiResponseBox');
                btn.disabled = true;
                btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Creating University Student ID...`;

                const payload = {
                    interested_university: uni.shortName,
                    full_name: document.getElementById('api_full_name').value.trim(),
                    email: document.getElementById('api_email').value.trim(),
                    mobile: document.getElementById('api_mobile').value.trim(),
                    course: document.getElementById('api_course').value,
                    specialization: document.getElementById('api_specialization').value || "",
                    dob: document.getElementById('api_dob').value.trim() || "",
                    source: "CV Partner",
                    sub_source: "API",
                    site: `EduMentor Info (${uni.shortName})`,
                    lead_owner: "5637",
                    timestamp: new Date().toISOString()
                };

                try {
                    // Save backup lead in Firebase "leads" collection
                    await addDoc(collection(db, "leads"), payload);

                    // Call server-side CV Partner endpoint (/api/submit-lead)
                    let apiData = null;
                    try {
                        const r = await fetch('/api/submit-lead', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(payload)
                        });
                        if (r.ok) apiData = await r.json();
                    } catch (_) {}

                    respBox.className = "p-3.5 rounded-xl text-xs font-bold bg-emerald-50 text-emerald-900 border border-emerald-200 block";
                    if (apiData && apiData.status) {
                        respBox.innerHTML = `✅ Student ID: <strong>${apiData.student_id}</strong><br>${getDuplicateMessage(apiData.exists)}`;
                        setTimeout(() => window.open(apiData.url || uni.link, '_blank'), 1200);
                    } else {
                        respBox.innerHTML = `✅ Profile Synced for <strong>${uni.name}</strong>! Redirecting to official portal...`;
                        setTimeout(() => window.open(uni.link, '_blank'), 1200);
                    }
                    btn.innerHTML = `Student Profile Synced ✓`;
                } catch (err) {
                    window.open(uni.link, '_blank');
                    btn.disabled = false;
                    btn.innerHTML = `Generate Student ID & Open Official Portal`;
                }
            });
        }

        // Load initial university
        loadUniversityByShortName(switcher.value || 'MUJ');
    </script>
