<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University Details & Live Matrix | EduMentor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700;800&display=swap');
        body { font-family: 'Plus Jakarta Sans', 'Poppins', sans-serif; background-color: #f8fafc; color: #334155; }
        .hero-gradient { background: linear-gradient(135deg, #002366 0%, #1e1b4b 100%); }
        .glass-nav { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(12px); border-bottom: 1px solid #e2e8f0; }
        .form-input {
            width: 100%;
            padding: 0.75rem 1rem;
            border: 1.5px solid #cbd5e1;
            border-radius: 0.75rem;
            background: #f8fafc;
            font-size: 0.875rem;
            font-weight: 600;
            color: #0f172a;
            outline: none;
            transition: all 0.2s;
        }
        .form-input:focus { border-color: #002366; background: #ffffff; box-shadow: 0 0 0 3px rgba(0, 35, 102, 0.1); }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

    <!-- Top Navigation -->
    <nav class="fixed w-full z-40 glass-nav top-0 transition-all">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center h-20 justify-between">
                <div class="flex items-center gap-3 cursor-pointer" onclick="window.location.href='edtech-universities.html'">
                    <div class="w-10 h-10 bg-indigo-50 hover:bg-indigo-100 transition rounded-xl flex items-center justify-center text-indigo-600 font-black shadow-inner"><i class="fa-solid fa-arrow-left"></i></div>
                    <span class="font-extrabold text-sm sm:text-base text-slate-900">Back to University Matrix</span>
                </div>
                <div class="flex items-center gap-2 cursor-pointer" onclick="window.location.href='index.html'">
                    <span class="text-xl sm:text-2xl font-black text-slate-900 tracking-tight">EduMentor</span>
                </div>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <div id="content-area" class="pb-20 pt-20 flex-grow">
        <div class="text-center py-40">
            <div class="w-12 h-12 border-4 border-indigo-200 border-t-indigo-600 rounded-full animate-spin mx-auto mb-4"></div>
            <p class="text-slate-500 font-bold text-base">Fetching Verified University Matrix...</p>
        </div>
    </div>

    <!-- Lead Verification Modal -->
    <div id="lead-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-6 sm:p-8 max-w-md w-full relative shadow-2xl border-t-8 border-t-[#FF8C00]">
            <button onclick="document.getElementById('lead-modal').classList.add('hidden')" class="absolute top-5 right-5 text-slate-400 hover:text-rose-600 transition"><i class="fa-solid fa-xmark text-xl"></i></button>
            
            <div class="w-14 h-14 bg-amber-50 text-amber-600 rounded-2xl flex items-center justify-center text-2xl mx-auto mb-4 border border-amber-200 shadow-inner"><i class="fa-solid fa-shield-halved"></i></div>
            <h3 class="text-2xl font-black mb-2 text-center text-slate-900">Unlock Official Portal 🎓</h3>
            <p class="text-xs text-center text-slate-500 mb-6 font-medium">To protect you from unverified brokers, we verify your contact details before routing to the official university admission gateway.</p>
            
            <form id="lead-form" class="space-y-3.5">
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">Full Student Name *</label>
                    <input type="text" id="lead-name" required placeholder="e.g. Rahul Sharma" class="form-input">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-500 uppercase tracking-wider mb-1">WhatsApp Mobile Number *</label>
                    <input type="tel" id="lead-phone" pattern="[0-9]{10}" required placeholder="10-digit mobile number" class="form-input">
                </div>
                
                <button type="submit" id="lead-submit-btn" class="w-full mt-2 py-4 bg-[#002366] hover:bg-indigo-700 text-white font-extrabold rounded-xl transition-all flex justify-center items-center gap-2 shadow-lg text-sm uppercase tracking-wider">
                    Proceed to Official Website <i class="fa-solid fa-arrow-right"></i>
                </button>
                <p class="text-[10px] text-center text-slate-400 font-bold uppercase tracking-wider mt-3"><i class="fa-solid fa-lock text-emerald-500"></i> 100% Financial Guard • Direct University Pay</p>
            </form>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getFirestore, doc, getDoc, collection, addDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js"; 

        const firebaseConfig = {
            apiKey: "AIzaSyAyxEZ4ukI8WRhV71RyS8JYJcXAICGAbto",
            authDomain: "edtech-7d520.firebaseapp.com",
            projectId: "edtech-7d520",
            storageBucket: "edtech-7d520.firebasestorage.app",
            messagingSenderId: "78074698553",
            appId: "1:78074698553:web:0dcbfd2b2c533febba26e8"
        };
        const app = initializeApp(firebaseConfig); 
        const db = getFirestore(app);

        let currentUni = null;
        const urlParams = new URLSearchParams(window.location.search);
        const uniId = urlParams.get('id');

        window.addEventListener('DOMContentLoaded', async () => {
            if (!uniId) {
                document.getElementById('content-area').innerHTML = `
                    <div class='text-center py-40'>
                        <div class='text-5xl mb-4'>⚠️</div>
                        <h2 class='text-2xl font-black text-slate-800'>Invalid University Link</h2>
                        <p class='text-slate-500 font-medium mt-2'>Please select an institution from the comparison matrix.</p>
                        <button onclick="window.location.href='edtech-universities.html'" class="mt-6 bg-indigo-600 text-white px-6 py-3 rounded-xl font-bold text-xs uppercase">Go to Matrix</button>
                    </div>`;
                return;
            }
            
            try {
                const docSnap = await getDoc(doc(db, 'universities', uniId));
                if (docSnap.exists()) {
                    currentUni = docSnap.data();
                    renderPage(currentUni);
                } else {
                    document.getElementById('content-area').innerHTML = "<div class='text-center py-40'><h2 class='text-2xl font-bold text-rose-500'>University Not Found in Database!</h2></div>";
                }
            } catch(e) {
                console.error("Fetch Error:", e);
                document.getElementById('content-area').innerHTML = "<div class='text-center py-40'><h2 class='text-2xl font-bold text-rose-500'>Error loading verified matrix data.</h2></div>";
            }
        });

        function renderPage(uni) {
            let nirfHtml = uni.nirf && uni.nirf !== "N/A" ? `<span class="bg-amber-400 text-slate-950 px-3 py-1.5 rounded-lg font-black text-xs shadow-sm border border-amber-500"><i class="fa-solid fa-trophy mr-1"></i> NIRF Rank: ${uni.nirf}</span>` : '';
            let naacHtml = uni.naac && uni.naac !== "N/A" ? `<span class="bg-white/20 px-3 py-1.5 rounded-lg font-extrabold text-xs backdrop-blur-md border border-white/30 text-white">NAAC ${uni.naac}</span>` : '';
            
            let programsHtml = "";
            if(uni.coursesList && uni.coursesList.length > 0) {
                uni.coursesList.forEach(course => {
                    programsHtml += `
                        <div class="border border-slate-200 rounded-2xl p-5 bg-white hover:border-indigo-400 hover:shadow-md transition-all mb-3 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                            <div>
                                <h4 class="font-extrabold text-slate-900 text-base flex items-center gap-2"><i class="fa-solid fa-graduation-cap text-indigo-600"></i> ${course.name}</h4>
                            </div>
                            <div class="bg-slate-50 px-4 py-2 rounded-xl border border-slate-100 text-center sm:text-right shrink-0">
                                <span class="text-[10px] font-extrabold text-slate-400 uppercase tracking-widest block mb-0.5">Est. Investment</span> 
                                <span class="font-black text-indigo-700">${course.fees || 'Check Portal'}</span>
                            </div>
                        </div>
                    `;
                });
            } else {
                programsHtml = `
                    <div class="border border-slate-200 rounded-2xl p-5 bg-white">
                        <h4 class="font-extrabold text-slate-900 text-base mb-1"><i class="fa-solid fa-graduation-cap text-indigo-600 mr-2"></i> ${uni.courses || 'Various UGC Programs'}</h4>
                        <p class="text-xs text-slate-500 font-medium">Detailed fee structure, eligibility and specializations available on official gateway.</p>
                    </div>`;
            }

            let feesDisplay = uni.fees && uni.fees !== "Pending" ? uni.fees : "<span class='text-sm text-amber-600 font-bold'>Verified on Portal</span>";
            let placementDisplay = uni.highest_placement && uni.highest_placement !== "Pending" ? uni.highest_placement : (uni.placement !== "Pending" ? uni.placement : "<span class='text-sm text-amber-600 font-bold'>Top Tier Corporate</span>");

            document.getElementById('content-area').innerHTML = `
                <!-- Dynamic Hero Section -->
                <div class="hero-gradient text-white pt-10 pb-20 px-6 relative overflow-hidden">
                    <div class="max-w-6xl mx-auto flex flex-col md:flex-row gap-8 items-start md:items-center relative z-10">
                        <div class="w-32 h-32 md:w-36 md:h-36 bg-white rounded-3xl flex items-center justify-center text-4xl md:text-6xl font-black text-indigo-900 shadow-2xl shrink-0 border-4 border-white/20">
                            ${(uni.name || "U").substring(0,3).toUpperCase()}
                        </div>
                        <div class="space-y-3">
                            <div class="flex flex-wrap gap-2.5">
                                ${nirfHtml} 
                                ${naacHtml}
                                ${uni.ai_verified ? '<span class="bg-emerald-600 text-white px-3 py-1.5 rounded-lg font-bold text-xs shadow border border-emerald-500 flex items-center gap-1.5"><i class="fa-solid fa-shield-check"></i> AI Verified Matrix</span>' : ''}
                            </div>
                            <h1 class="text-3xl md:text-4xl lg:text-5xl font-black tracking-tight text-white">${uni.name}</h1>
                            <p class="text-indigo-200 font-bold text-sm md:text-base flex items-center gap-2"><i class="fa-solid fa-location-dot text-amber-400"></i> ${uni.state || 'India (All Regions)'} • UGC-DEB Entitled</p>
                        </div>
                    </div>
                </div>

                <!-- Main Grid -->
                <div class="max-w-6xl mx-auto px-4 sm:px-6 py-12 flex flex-col lg:flex-row gap-8 relative z-20 -mt-12">
                    
                    <!-- Left Content -->
                    <div class="lg:w-2/3 space-y-6">
                        
                        <!-- High Level Stats Cards -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                            <div class="bg-white p-6 rounded-3xl border border-emerald-100 text-center shadow-lg shadow-emerald-100/30">
                                <div class="w-12 h-12 bg-emerald-50 text-emerald-600 rounded-2xl flex items-center justify-center text-xl mx-auto mb-3"><i class="fa-solid fa-briefcase"></i></div>
                                <p class="text-[11px] text-emerald-700 uppercase font-black tracking-widest mb-1">Placement / Package</p>
                                <p class="text-2xl font-black text-slate-900">${placementDisplay}</p>
                            </div>
                            <div class="bg-white p-6 rounded-3xl border border-indigo-100 text-center shadow-lg shadow-indigo-100/30">
                                <div class="w-12 h-12 bg-indigo-50 text-indigo-600 rounded-2xl flex items-center justify-center text-xl mx-auto mb-3"><i class="fa-solid fa-wallet"></i></div>
                                <p class="text-[11px] text-indigo-700 uppercase font-black tracking-widest mb-1">Starting Investment</p>
                                <p class="text-2xl font-black text-slate-900">${feesDisplay}</p>
                            </div>
                        </div>

                        <!-- Programs Listing -->
                        <div class="bg-white p-6 sm:p-8 rounded-3xl border border-slate-200 shadow-sm space-y-4">
                            <h2 class="text-xl font-black text-slate-900 border-b border-slate-100 pb-3 flex items-center gap-2"><i class="fa-solid fa-book-open text-indigo-600"></i> Available Programs & Specializations</h2>
                            <div>${programsHtml}</div>
                        </div>

                        <!-- Approvals Section -->
                        <div class="bg-white p-6 sm:p-8 rounded-3xl border border-slate-200 shadow-sm space-y-3">
                            <h2 class="text-xl font-black text-slate-900 flex items-center gap-2"><i class="fa-solid fa-award text-indigo-600"></i> Accreditations & Recognitions</h2>
                            <div class="flex flex-wrap gap-2 pt-2">
                                ${uni.approvals ? uni.approvals.split(',').map(app => `<span class="bg-indigo-50 text-indigo-800 px-3.5 py-2 rounded-xl font-bold text-xs border border-indigo-200">${app.trim()}</span>`).join('') : '<span class="text-slate-500 font-medium text-xs">UGC-DEB, AICTE Approved</span>'}
                            </div>
                        </div>
                    </div>

                    <!-- Right Sticky Action Bar -->
                    <div class="lg:w-1/3">
                        <div class="sticky top-[100px] bg-white p-6 sm:p-8 border border-slate-200 rounded-3xl shadow-xl border-t-6 border-t-[#FF8C00] space-y-5">
                            <div class="flex justify-between items-center">
                                <h3 class="text-xl font-black text-slate-900">Admissions Open</h3>
                                <span class="bg-orange-500 text-white text-[10px] font-black px-3 py-1 rounded-full uppercase tracking-wider animate-pulse">2027 Session</span>
                            </div>
                            <p class="text-xs font-medium text-slate-500 leading-relaxed">Ensure a safe and fraud-free application. Click below to generate your student ID and securely access the official university portal.</p>
                            
                            <button onclick="document.getElementById('lead-modal').classList.remove('hidden')" class="w-full py-4 bg-[#FF8C00] hover:bg-orange-600 text-white font-black rounded-xl shadow-lg transition flex items-center justify-center gap-2 text-sm uppercase tracking-wider">
                                Verify & Open Official Portal <i class="fa-solid fa-arrow-up-right-from-square"></i>
                            </button>
                            
                            <div class="pt-4 border-t border-slate-100 flex items-start gap-3">
                                <div class="w-10 h-10 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center shrink-0 border border-emerald-200"><i class="fa-solid fa-shield-halved"></i></div>
                                <div>
                                    <p class="text-xs text-slate-900 font-extrabold mb-0.5">100% Financial Guard</p>
                                    <p class="text-[11px] text-slate-500 font-medium leading-relaxed">Direct fee payment to university account with zero middleman risk.</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            `;
        }

        // Lead Submission & Secure Redirection
        document.getElementById('lead-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('lead-submit-btn');
            btn.innerHTML = `<i class="fa-solid fa-circle-notch fa-spin"></i> Verifying & Routing...`; 
            btn.disabled = true;
            
            try {
                await addDoc(collection(db, 'leads'), {
                    name: document.getElementById('lead-name').value.trim(), 
                    phone: document.getElementById('lead-phone').value.trim(),
                    universityId: uniId,
                    universityName: currentUni.name, 
                    source: "CV Partner",
                    timestamp: new Date().toISOString()
                });
                
                let webLink = currentUni.website || currentUni.link || "https://collegevidya.com/";
                if (!webLink.startsWith('http')) webLink = 'https://' + webLink;
                
                setTimeout(() => {
                    window.open(webLink, '_blank');
                    document.getElementById('lead-modal').classList.add('hidden');
                    document.getElementById('lead-form').reset();
                    btn.disabled = false;
                    btn.innerHTML = `Proceed to Official Website <i class="fa-solid fa-arrow-right"></i>`;
                }, 1000);
            } catch(e) {
                alert("Connection error! Routing directly to official website...");
                window.open(currentUni.website || "https://collegevidya.com/", '_blank');
                btn.disabled = false;
                btn.innerHTML = `Proceed to Official Website <i class="fa-solid fa-arrow-right"></i>`;
            }
        });
    </script>
</body>
</html>
